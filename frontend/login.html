<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Phoneme Forge</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%237c3aed'/><text x='16' y='22' font-size='16' text-anchor='middle' fill='%23fdf8ff' font-weight='bold'>P</text></svg>" />
  <link rel="stylesheet" href="css/styles.css" />
  <script>(function(){var t=localStorage.getItem('pf_theme');document.documentElement.setAttribute('data-theme',t||'dark');})()</script>
</head>
<body>
 
<div id="cursor-dot"></div>
<div id="cursor-ring"></div>
<canvas id="cursor-trail-canvas"></canvas>
 
<nav class="nav">
  <a class="nav-logo" href="index.html"><span>Phoneme</span> Forge</a>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="app.html">Practice</a>
    <a href="dashboard.html">Dashboard</a>
    <button class="theme-toggle" id="themeToggle" title="Toggle theme">☀️</button>
  </div>
</nav>
 
<div style="position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 70% 60% at 30% 40%,rgba(167,139,250,0.06) 0%,transparent 60%),radial-gradient(ellipse 50% 40% at 70% 70%,rgba(45,212,191,0.04) 0%,transparent 60%);"></div>
 
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo"><span>Phoneme</span> Forge</div>
    <div class="auth-tagline">// AI Pronunciation Coach</div>
 
    <div class="tabs-auth">
      <div class="tab-auth active" onclick="switchTab('login')">Sign In</div>
      <div class="tab-auth"       onclick="switchTab('register')">Create Account</div>
    </div>
 
    <div class="auth-error" id="authError"></div>
 
    <!-- Google redirect loading indicator -->
    <div id="redirectState" style="display:none;text-align:center;padding:1.5rem 0;">
      <div style="width:32px;height:32px;border-radius:50%;border:3px solid var(--border-mid);border-top-color:var(--amber);animation:spin 0.8s linear infinite;margin:0 auto 0.9rem;"></div>
      <div style="font-size:0.83rem;color:var(--text-3);">Completing Google sign-in…</div>
    </div>
 
    <!-- Sign In -->
    <div id="loginForm">
      <div class="field">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="email" />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password" />
      </div>
      <div style="text-align:right;margin-bottom:0.6rem;">
        <button onclick="resetPassword()" style="background:none;border:none;color:var(--text-3);font-size:0.78rem;cursor:pointer;font-family:inherit;">Forgot password?</button>
      </div>
      <button class="btn-full" id="loginBtn" onclick="handleLogin()">
        <span id="loginBtnText">Sign In</span>
      </button>
      <div class="or-divider">or</div>
      <button class="btn-google" id="googleBtn" onclick="handleGoogle()">
        <svg width="16" height="16" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Continue with Google
      </button>
    </div>
 
    <!-- Register -->
    <div id="registerForm" style="display:none;">
      <div class="field">
        <label>Display Name</label>
        <input type="text" id="regName" placeholder="Your name" autocomplete="name" />
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="regEmail" placeholder="you@example.com" autocomplete="email" />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="regPassword" placeholder="Min. 6 characters" autocomplete="new-password" />
      </div>
      <button class="btn-full" id="registerBtn" onclick="handleRegister()">
        <span id="registerBtnText">Create Account</span>
      </button>
    </div>
 
    <div style="text-align:center;margin-top:1.2rem;">
      <a href="app.html" style="font-size:0.78rem;color:var(--text-4);text-decoration:none;">Continue without account →</a>
    </div>
  </div>
</div>
 
<!-- Success overlay -->
<div id="successOverlay" style="display:none;position:fixed;inset:0;z-index:900;background:rgba(13,11,26,0.92);backdrop-filter:blur(10px);align-items:center;justify-content:center;flex-direction:column;gap:1rem;">
  <div style="font-size:3rem;">✅</div>
  <div style="font-family:'Syne',sans-serif;font-weight:700;font-size:1.4rem;color:var(--text-1);" id="successMsg">Welcome!</div>
  <div style="font-size:0.85rem;color:var(--text-3);">Redirecting to your dashboard…</div>
</div>
 
<script src="js/cursor.js"></script>
<script src="js/theme.js"></script>
 
<script type="module">
import { auth } from "./firebase-config.js";
import {
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword,
  GoogleAuthProvider,
  signInWithRedirect,
  getRedirectResult,
  sendPasswordResetEmail,
  updateProfile,
  onAuthStateChanged,
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
 
const SESSION_KEY = "vs_user";
const provider    = new GoogleAuthProvider();
 
/* Handle redirect result first (called after Google sends user back) */
(async () => {
  document.getElementById("redirectState").style.display = "none";
  try {
    const result = await getRedirectResult(auth);
    if (result?.user) {
      saveSession(result.user);
      showSuccess(result.user.displayName || result.user.email.split("@")[0]);
    }
  } catch (e) {
    if (e.code && e.code !== "auth/no-current-user") {
      showError(friendlyError(e));
    }
  }
})();
 
/* If already signed in skip straight to dashboard */
onAuthStateChanged(auth, user => {
  if (user) {
    saveSession(user);
    window.location.href = "dashboard.html";
  }
});
 
function saveSession(user) {
  const data = {
    uid:     user.uid,
    email:   user.email,
    name:    user.displayName || user.email.split("@")[0],
    picture: user.photoURL || "",
  };
  sessionStorage.setItem(SESSION_KEY, JSON.stringify(data));
  localStorage.setItem(SESSION_KEY, JSON.stringify(data));
  return data;
}
 
function showSuccess(name) {
  const o = document.getElementById("successOverlay");
  document.getElementById("successMsg").textContent = `Welcome, ${name}! 🎉`;
  o.style.display = "flex";
  setTimeout(() => { window.location.href = "dashboard.html"; }, 1600);
}
 
function showError(msg) {
  const el = document.getElementById("authError");
  el.textContent = msg;
  el.classList.add("show");
}
 
function clearError() {
  document.getElementById("authError").classList.remove("show");
}
 
function friendlyError(err) {
  const map = {
    "auth/user-not-found":        "No account found with this email.",
    "auth/wrong-password":        "Incorrect password. Try again.",
    "auth/invalid-credential":    "Incorrect email or password.",
    "auth/email-already-in-use":  "This email is already registered. Try signing in.",
    "auth/weak-password":         "Password must be at least 6 characters.",
    "auth/invalid-email":         "Please enter a valid email address.",
    "auth/too-many-requests":     "Too many attempts — wait a moment and try again.",
    "auth/popup-closed-by-user":  "Sign-in was cancelled.",
    "auth/network-request-failed":"Network error. Check your connection.",
  };
  return map[err.code] || err.message || "An error occurred. Please try again.";
}
 
/* Email sign in */
window.handleLogin = async function() {
  clearError();
  const email = document.getElementById("loginEmail").value.trim();
  const pass  = document.getElementById("loginPassword").value;
  if (!email || !pass) { showError("Please fill in both fields."); return; }
  const btn = document.getElementById("loginBtn");
  btn.disabled = true;
  document.getElementById("loginBtnText").textContent = "Signing in…";
  try {
    const cred = await signInWithEmailAndPassword(auth, email, pass);
    showSuccess(saveSession(cred.user).name);
  } catch (e) {
    showError(friendlyError(e));
    btn.disabled = false;
    document.getElementById("loginBtnText").textContent = "Sign In";
  }
};
 
/* Register */
window.handleRegister = async function() {
  clearError();
  const name  = document.getElementById("regName").value.trim();
  const email = document.getElementById("regEmail").value.trim();
  const pass  = document.getElementById("regPassword").value;
  if (!name || !email || !pass) { showError("Please fill in all fields."); return; }
  if (pass.length < 6)          { showError("Password must be at least 6 characters."); return; }
  const btn = document.getElementById("registerBtn");
  btn.disabled = true;
  document.getElementById("registerBtnText").textContent = "Creating account…";
  try {
    const cred = await createUserWithEmailAndPassword(auth, email, pass);
    await updateProfile(cred.user, { displayName: name });
    showSuccess(saveSession({ ...cred.user, displayName: name }).name);
  } catch (e) {
    showError(friendlyError(e));
    btn.disabled = false;
    document.getElementById("registerBtnText").textContent = "Create Account";
  }
};
 
/* Google — redirect based, no popup */
window.handleGoogle = function() {
  clearError();
  const btn = document.getElementById("googleBtn");
  btn.disabled = true;
  btn.innerHTML = `<div style="width:14px;height:14px;border-radius:50%;border:2px solid var(--border-mid);border-top-color:var(--amber);animation:spin 0.7s linear infinite;display:inline-block;vertical-align:middle;margin-right:8px;"></div>Redirecting to Google…`;
  signInWithRedirect(auth, provider);
};
 
/* Forgot password */
window.resetPassword = async function() {
  clearError();
  const email = document.getElementById("loginEmail").value.trim();
  if (!email) { showError("Enter your email address above first."); return; }
  try {
    await sendPasswordResetEmail(auth, email);
    showError("✅ Reset email sent — check your inbox.");
  } catch (e) {
    showError(friendlyError(e));
  }
};
</script>
 
<script>
window.switchTab = function(tab) {
  document.querySelectorAll('.tab-auth')[0].classList.toggle('active', tab === 'login');
  document.querySelectorAll('.tab-auth')[1].classList.toggle('active', tab === 'register');
  document.getElementById('loginForm').style.display    = tab === 'login'    ? '' : 'none';
  document.getElementById('registerForm').style.display = tab === 'register' ? '' : 'none';
  document.getElementById('authError').classList.remove('show');
};
 
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const loginVisible = document.getElementById('loginForm').style.display !== 'none';
  if (loginVisible) window.handleLogin?.();
  else window.handleRegister?.();
});
</script>
</body>
</html>
